# Netlify configuration — DEX Global Sourcing Assistant
#
# Serverless mode: no Redis, no background worker. The search pipeline is
# advanced step-by-step by the dashboard via /api/searches/[id]/tick.
# Requires env vars (Site configuration → Environment variables):
#   DATABASE_URL   — Postgres connection string (Neon free tier works)
#   AUTH_SECRET    — any long random string
#   TAVILY_API_KEY — supplier search
#   OPENAI_API_KEY — optional AI identification/enrichment
#   RESEND_API_KEY + EMAIL_FROM — optional email verification
#   QUEUE_DRIVER   — set to "inline" (also implied when REDIS_URL is unset)

[build]
  # DATABASE_URL falls back to NETLIFY_DATABASE_URL (Netlify's one-click Neon DB).
  command = "export DATABASE_URL=\"${DATABASE_URL:-$NETLIFY_DATABASE_URL}\" && corepack enable && corepack prepare pnpm@9.15.9 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @dex/db build && pnpm --filter @dex/ai build && pnpm --filter @dex/integrations build && pnpm --filter @dex/knowledge build && pnpm --filter @dex/core build && pnpm db:migrate && pnpm --filter @dex/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  QUEUE_DRIVER = "inline"
  ARTIFACT_STORAGE = "local"
  ARTIFACT_LOCAL_PATH = "/tmp/dex-artifacts"
  AI_ENABLED = "true"
  RESULT_LIMIT = "10"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
